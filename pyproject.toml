[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drive-pdf-downloader"
version = "2.0.0"
description = "Download view-only Google Drive PDFs as clean, verified image PDFs on Windows, macOS and Linux."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "24F2", url = "https://github.com/W24F2" }]
keywords = ["google-drive", "pdf", "view-only", "playwright", "scraper", "archival"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = [
  "playwright>=1.44",
  "Pillow>=10.2",
  "img2pdf>=0.5",
  "pypdfium2>=4.30",
]

[project.urls]
Homepage = "https://github.com/W24F2/drive-pdf-downloader"
Issues = "https://github.com/W24F2/drive-pdf-downloader/issues"
Wiki = "https://github.com/W24F2/drive-pdf-downloader/wiki"

[project.scripts]
drive-pdf-downloader = "drive_pdf_downloader:main"

[tool.setuptools]
py-modules = ["drive_pdf_downloader"]

[tool.ruff]
line-length = 110
target-version = "py39"
exclude = [".venv", "downloads", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T"]
